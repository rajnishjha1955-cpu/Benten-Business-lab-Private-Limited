document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

2.4vw,32px);font-weight:800;letter-spacing:-.035em;color:#1A0B2E\">21+ years<\u002Fdiv>\n            <div style=\"font-size:15px;line-height:1.6;color:#5F5575;margin-top:8px\">Across banking, NBFC and business lending — SME credit, trade finance and supply chain finance.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top:2px solid #1A0B2E;padding-top:16px\">\n            <div style=\"font-size:clamp(24px,2.4vw,32px);font-weight:800;letter-spacing:-.035em;color:#1A0B2E\">Built from zero<\u002Fdiv>\n            <div style=\"font-size:15px;line-height:1.6;color:#5F5575;margin-top:8px\">Set up supply chain finance businesses from the ground up and took them to profitability inside the first year.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top:2px solid #1A0B2E;padding-top:16px\">\n            <div style=\"font-size:clamp(24px,2.4vw,32px);font-weight:800;letter-spacing:-.035em;color:#1A0B2E\">National scale<\u002Fdiv>\n            <div style=\"font-size:15px;line-height:1.6;color:#5F5575;margin-top:8px\">Led large, geographically distributed SME lending teams and portfolios across India.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top:2px solid #1A0B2E;padding-top:16px\">\n            <div style=\"font-size:clamp(24px,2.4vw,32px);font-weight:800;letter-spacing:-.035em;color:#1A0B2E\">Independent Director<\u002Fdiv>\n            <div style=\"font-size:15px;line-height:1.6;color:#5F5575;margin-top:8px\">Qualified Independent Director, with credit policy and governance experience.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"products\" style=\"padding:clamp(72px,8vw,124px) 0;background:linear-gradient(180deg,#F9F6FC 0%,#FFFFFF 100%);border-top:1px solid #F2EEF7;scroll-margin-top:80px\">\n  <div style=\"max-width:1220px;margin:0 auto;padding:0 24px\">\n    <div data-reveal=\"\" style=\"display:flex;flex-wrap:wrap;gap:28px 8px,2.8vw,38px);display:flex;flex-direction:column;gap:18px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:14px\">\n          <span style=\"font-size:11.5px;font-weight:700;letter-spacing:.16em;color:#D9B75A\">PHARMACEUTICALS<\u002Fspan>\n          <span style=\"font-size:11.5px;font-weight:700;letter-spacing:.12em;color:#A08CC0\">FACTORING<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:clamp(32px,3.2vw,44px);font-weight:800;letter-spacing:-.04em;color:#fff;line-height:1\">₹8.5 Cr<\u002Fdiv>\n        <p style=\"margin:0;font-size:16px;line-height:1.65;color:#E6DCF2\">A 90-day receivables programme released blocked cash for a distributor network and removed the need for a fresh equity round.<\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"background:rgba(26,11,46,.55);padding:clamp(28px,2.8vw,38px);display:flex;flex-direction:column;gap:18px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:14px\">\n          <span style=\"font-size:11.5px;font-weight:700;letter-spacing:.16em;color:#D9B75A\">AUTO COMPONENTS<\u002Fspan>\n          <span style=\"font-size:11.5px;font-weight:700;letter-spacing:.12em;color:#A08CC0\">DEALER FINANCE<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:clamp(32px,3.2vw,44px);font-weight:800;letter-spacing:-.04em;color:#fff;line-height:1\">₹25 Cr<\u002Fdiv>\n        <p style=\"margin:0;font-size:16px;line-height:1.65;color:#E6DCF2\">An anchor-backed channel programme across 40+ dealers, structured with two lenders to keep pricing competitive at scale.<\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"background:rgba(26,11,46,.55);padding:clamp(28px,2.8vw,38px);display:flex;flex-direction:column;gap:18px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:14px\">\n          <span style=\"font-size:11.5px;font-weight:700;letter-spacing:.16em;color:#D9B75A\">SPECIALITY CHEMICALS<\u002Fspan>\n          <span style=\"font-size:11.5px;font-weight:700;letter-spacing:.12em;color:#A08CC0\">WORKING CAPITAL<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:clamp(32px,3.2vw,44px);font-weight:800;letter-spacing:-.04em;color:#fff;line-height:1\">₹12 Cr<\u002Fdiv>\n        <p style=\"margin:0;font-size:16px;line-height:1.65;color:#E6DCF2\">A limit enhancement closed in under six weeks after two banks had declined the file on structure, not on credit.<\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"background:rgba(26,11,46,.55);padding:clamp(28px,2.8vw,38px);display:flex;flex-direction:column;gap:18px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:14px\">\n          <span style=\"font-size:11.5px;font-weight:700;letter-spacing:.16em;color:#D9B75A\">EPC &amp; INFRASTRUCTURE<\u002Fspan>\n          <span style=\"font-size:11.5px;font-weight:700;letter-spacing:.12em;color:#A08CC0\">SUPPLY CHAIN FINANCE<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:clamp(32px,3.2vw,44px);font-weight:800;letter-spacing:-.04em;color:#fff;line-height:1\">₹40 Cr<\u002Fdiv>\n        <p style=\"margin:0;font-size:16px;line-height:1.65;color:#E6DCF2\">A vendor finance programme that shortened supplier payment cycles from 120 days to 15, on an anchor's balance sheet strength.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div data-reveal=\"\" style=\"margin-top:clamp(28px,3vw,40px);display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px\">\n      <div style=\"border-left:2px solid rgba(217,183,90,.5);padding:4px 0 4px 22px\">\n        <div style=\"font-size:clamp(24px,2.4vw,32px);font-weight:800;letter-spacing:-.035em;color:#fff\">450+<\u002Fdiv>\n        <div style=\"font-size:14px;line-height:1.6;color:#C9B8E0;margin-top:8px\">Businesses supported to date<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-left:2px solid rgba(217,183,90,.5);padding:4px 0 4px 22px\">\n        <div style=\"font-size:clamp(24px,2.4vw,32px);font-weight:800;letter-spacing:-.035em;color:#fff\">9 sectors<\u002Fdiv>\n        <div style=\"font-size:14px;line-height:1.6;color:#C9B8E0;margin-top:8px\">Pharma, textile, EPC, chemicals, engineering, auto, food, metals, energy<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"contact\" style=\"padding:clamp(72px,8vw,124px) 0;scroll-margin-top:80px\">\n  <div style=\"max-width:1220px;margin:0 auto;padding:0 24px\">\n    <div style=\"display:flex;flex-wrap:wrap;gap:clamp(36px,5vw,72px)\">\n      <div data-reveal=\"\" style=\"flex:1 1 340px;min-width:280px\">\n        <div style=\"font-size:11.5px;font-weight:700;letter-spacing:.2em;color:#7B3FC4;margin-bottom:18px\">CONTACT US<\u002Fdiv>\n        <h2 style=\"margin:0 0 20px;font-size:clamp(30px,3.6vw,46px);line-height:1.07;letter-spacing:-.035em;font-weight:800;color:#1A0B2E\">Tell us what you need to finance<\u002Fh2>\n        <p style=\"margin:0 0 40px;font-size:17px;line-height:1.65;color:#554A6B;max-width:460px\">Share a few details and our credit team will revert with an indicative structure — typically within two working days.<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:26px\">\n          <div>\n            <div style=\"font-size:11.5px;font-weight:700;letter-spacing:.14em;color:#8E84A3;margin-bottom:8px\">REGISTERED OFFICE<\u002Fdiv>\n            <div style=\"font-size:16px;line-height:1.6;color:#1F0E36;font-weight:600\">30-31 Regal Building, 1st Floor,<br>Parliament Street, Connaught Place,<br>New Delhi – 110001<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size:11.5px;font-weight:700;letter-spacing:.14em;color:#8E84A3;margin-bottom:8px\">EMAIL<\u002Fdiv>\n            <a href=\"mailto:info@benten.co.in\" style=\"font-size:16px;font-weight:600\">info@benten.co.in<\u002Fa>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size:11.5px;font-weight:700;letter-spacing:.14em;color:#8E84A3;margin-bottom:8px\">PHONE<\u002Fdiv>\n            <a href=\"tel:+919990832828\" style=\"font-size:16px;font-weight:600\">+91 99908 32828<\u002Fa>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size:11.5px;font-weight:700;letter-spacing:.14em;color:#8E84A3;margin-bottom:8px\">PRESENCE<\u002Fdiv>\n            <div style=\"font-size:16px;font-weight:600;color:#1F0E36\">Delhi NCR &nbsp;·&nbsp; Mumbai &nbsp;·&nbsp; Chennai<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"flex:1 1 480px;min-width:290px\">\n        <div style=\"border:1px solid #E9E3F1;border-radius:20px;padding:clamp(26px,3vw,40px);background:#FCFBFE;box-shadow:0 30px 60px -40px rgba(31,14,54,.35)\">\n          <sc-if value=\"{{ submitted }}\">\n            <div style=\"padding:32px 0;text-align:center\">\n              <div style=\"width:56px;height:56px;border-radius:50%;background:#E7F6EE;display:flex;align-items:center;justify-content:center;margin:0 auto 22px\">\n                <span style=\"width:18px;height:9px;border-left:2.5px solid #0E7A50;border-bottom:2.5px solid #0E7A50;display:block;transform:rotate(-45deg) translate(2px,-2px)\"><\u002Fspan>\n              <\u002Fdiv>\n              <h3 style=\"margin:0 0 12px;font-size:23px;font-weight:800;letter-spacing:-.02em;color:#1A0B2E\">Enquiry received<\u002Fh3>\n              <p style=\"margin:0 0 26px;font-size:16px;line-height:1.65;color:#5F5575\">Thank you. Our credit team will review your requirement and revert shortly.<\u002Fp>\n              <button sc-camel-on-click=\"{{ resetForm }}\" style=\"background:none;border:1px solid #DAD1E8;border-radius:9px;padding:13px 24px;font-size:15px;font-weight:700;color:#1F0E36;cursor:pointer\">Submit another enquiry<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ notSubmitted }}\" hi ducts\" style=\"font-size:15px;color:#E6DCF2\" style-hover=\"color:#fff\">Products<\u002Fa>\n          <a href=\"#success\" style=\"font-size:15px;color:#E6DCF2\" style-hover=\"color:#fff\">Success Stories<\u002Fa>\n          <a href=\"#contact\" style=\"font-size:15px;color:#E6DCF2\" style-hover=\"color:#fff\">Contact Us<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:0 1 280px\">\n        <div style=\"font-size:11.5px;font-weight:700;letter-spacing:.16em;color:#A08CC0;margin-bottom:16px\">REACH US<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <span style=\"font-size:15px;line-height:1.6;color:#E6DCF2\">30-31 Regal Building, Parliament Street, Connaught Place, New Delhi – 110001<\u002Fspan>\n          <a href=\"mailto:info@benten.co.in\" style=\"font-size:15px;color:#E6DCF2\" style-hover=\"color:#fff\">info@benten.co.in<\u002Fa>\n          <a href=\"tel:+919990832828\" style=\"font-size:15px;color:#E6DCF2\" style-hover=\"color:#fff\">+91 99908 32828<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding-top:24px;display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between\">\n      <span style=\"font-size:13px;color:#A08CC0\">© 2026 Benten Business Lab Private Limited. All rights reserved.<\u002Fspan>\n      <sc-if value=\"{{ showStatutory }}\" hint-placeholder-val=\"{{ true }}\">\n        <span style=\"font-size:13px;color:#A08CC0\">CIN U70200UP2026PTC244163 &nbsp;·&nbsp; GST 09AAOCB4417D1ZQ<\u002Fspan>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showFounderPortrait&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;showStatutoryLine&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Content&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    navOpen: false,\n    width: typeof window !== 'undefined' ? window.innerWidth : 1280,\n    submitted: false,\n    form: { name: '', company: '', email: '', phone: '', role: 'Business seeking financing', product: 'Invoice Discounting', amount: '', message: '' }\n  };\n\n  componentDidMount() {\n    this._onResize = () => this.setState({ width: window.innerWidth });\n    window.addEventListener('resize', this._onResize);\n\n    const els = Array.from(document.querySelectorAll('[data-reveal]'));\n    els.forEach((el, i) => {\n      el.style.opacity = '0';\n      el.style.transform = 'translateY(20px)';\n      el.style.transition = 'opacity .75s cubic-bezier(.2,.7,.2,1) ' + ((i % 4) * 70) + 'ms, transform .75s cubic-bezier(.2,.7,.2,1) ' + ((i % 4) * 70) + 'ms';\n    });\n    this._io = new IntersectionObserver((entries) => {\n      entries.forEach((e) => {\n        if (e.isIntersecting) {\n          e.target.style.opacity = '1';\n          e.target.style.transform = 'none';\n          this._io.unobserve(e.target);\n        }\n      });\n    }, { rootMargin: '0px 0px -8% 0px', threshold: 0.08 });\n    els.forEach((el) => this._io.observe(el));\n\n    this._co = new IntersectionObserver((entries) => {\n      entries.forEach((e) => {\n        if (e.isIntersecting) { this.animateCount(e.target); this._co.unobserve(e.target); }\n      });\n    }, { threshold: 0.4 });\n    Array.from(document.querySelectorAll('[data-count-to]')).forEach((el) => this._co.observe(el));\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('resize', this._onResize);\n    if (this._io) this._io.disconnect();\n    if (this._co) this._co.disconnect();\n  }\n\n  animateCount(el) {\n    const target = parseFloat(el.getAttribute('data-count-to')) || 0;\n    const pre = el.getAttribute('data-count-prefix') || '';\n    const suf = el.getAttribute('data-count-suffix') || '';\n    const dur = 1400, t0 = performance.now();\n    const tick = (now) => {\n      const p = Math.min(1, (now - t0) / dur);\n      const eased = 1 - Math.pow(1 - p, 3);\n      el.textContent = pre + Math.round(target * eased) + suf;\n      if (p < 1) requestAnimationFrame(tick);\n    };\n    requestAnimationFrame(tick);\n  }\n\n  set(key) {\n    return (e) => {\n      const v = e.target.value;\n      this.setState((s) => ({ form: Object.assign({}, s.form, { [key]: v }) }));\n    };\n  }\n\n  renderVals() {\n    const desktop = this.state.width >= 940;\n    return {\n      isDesktop: desktop,\n      isMobile: !desktop,\n      navOpen: this.state.navOpen && !desktop,\n      toggleNav: () => this.setState((s) => ({ navOpen: !s.navOpen })),\n      closeNav: () => this.setState({ navOpen: false }),\n      showFounderPortrait: this.props.showFounderPortrait ?? true,\n      showStatutory: this.props.showStatutoryLine ?? true,\n      submitted: this.state.submitted,\n      notSubmitted: !this.state.submitted,\n      form: this.state.form,\n      setName: this.set('name'),\n      setCompany: this.set('company'),\n      setEmail: this.set('email'),\n      setPhone: this.set('phone'),\n      setRole: this.set('role'),\n      setProduct: this.set('product'),\n      setAmount: this.set('amount'),\n      setMessage: this.set('message'),\n      onSubmit: (e) => {\n        e.preventDefault();\n        const f = this.state.form;\n        const body = ['Name: ' + f.name, 'Company: ' + f.company, 'Email: ' + f.email, 'Phone: ' + f.phone, 'I am a: ' + f.role, 'Requirement: ' + f.product, 'Facility size: ' + (f.amount || '-'), '', f.message].join('\\n');\n        window.location.href = 'mailto:info@benten.co.in?subject=' + encodeURIComponent('Financing enquiry — ' + f.company) + '&body=' + encodeURIComponent(body);\n        this.setState({ submitted: true });\n      },\n      resetForm: () => this.setState({ submitted: false, form: { name: '', company: '', email: '', phone: '', role: 'Business seeking financing', product: 'Invoice Discounting', amount: '', message: '' } })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
